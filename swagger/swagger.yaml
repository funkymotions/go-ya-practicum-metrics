definitions:
  models.Metrics:
    properties:
      delta:
        type: integer
      hash:
        type: string
      id:
        type: string
      type:
        type: string
      value:
        type: number
    type: object
info:
  contact: {}
paths:
  /:
    get:
      description: Returns all metrics rendered as an HTML page
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with all metrics
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get all metrics
      tags:
      - metrics
  /ping:
    get:
      description: Checks the availability of the metrics service
      produces:
      - text/plain
      responses:
        "200":
          description: Service is healthy
          schema:
            type: string
        "500":
          description: Service is unavailable
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /update/:
    post:
      consumes:
      - application/json
      description: Updates a single metric using a JSON payload
      parameters:
      - description: Metric to update
        in: body
        name: metric
        required: true
        schema:
          $ref: '#/definitions/models.Metrics'
      produces:
      - application/json
      responses:
        "200":
          description: Updated metric
          schema:
            $ref: '#/definitions/models.Metrics'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Metric Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update metric by JSON
      tags:
      - metrics
  /update/{type}/{name}/{value}:
    post:
      description: Updates a single metric identified by type and name using a value
        from the URL
      parameters:
      - description: Metric type (counter or gauge)
        in: path
        name: type
        required: true
        type: string
      - description: Metric name
        in: path
        name: name
        required: true
        type: string
      - description: Metric value
        in: path
        name: value
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Metric updated
          schema:
            type: string
        "400":
          description: Invalid metric parameters or value
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update metric
      tags:
      - metrics
  /updates/:
    post:
      consumes:
      - application/json
      description: Updates multiple metrics in a single JSON request
      parameters:
      - description: HMAC-SHA256 hash of payload
        in: header
        name: hashsha256
        type: string
      - description: List of metrics to update
        in: body
        name: metrics
        required: true
        schema:
          items:
            $ref: '#/definitions/models.Metrics'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Empty JSON object on success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Metric Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Bulk update metrics
      tags:
      - metrics
  /value/:
    post:
      consumes:
      - application/json
      description: Returns a single metric identified in the JSON payload
      parameters:
      - description: Metric descriptor
        in: body
        name: metric
        required: true
        schema:
          $ref: '#/definitions/models.Metrics'
      produces:
      - application/json
      responses:
        "200":
          description: Metric found
          schema:
            $ref: '#/definitions/models.Metrics'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Metric Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get metric by JSON
      tags:
      - metrics
  /value/{type}/{name}:
    get:
      description: Returns the current value of a single metric by type and name
      parameters:
      - description: Metric type (counter or gauge)
        in: path
        name: type
        required: true
        type: string
      - description: Metric name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Metric value
          schema:
            type: string
        "400":
          description: Invalid metric parameters
          schema:
            type: string
        "404":
          description: Metric not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get metric
      tags:
      - metrics
swagger: "2.0"
